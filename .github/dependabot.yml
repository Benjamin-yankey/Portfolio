version: 2
updates:
  # The site's npm dependencies. Minor and patch updates arrive as one
  # grouped pull request a week; majors come separately. CI tests each one.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # The workflows' actions (actions/checkout etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
