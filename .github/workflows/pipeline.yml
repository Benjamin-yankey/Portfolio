name: Pipeline

# The one pipeline for every change: check first, then deploy — and only if
# the checks pass, so a broken commit never goes live.
#   Pushes to main (including CMS saves): check → GitHub Pages + Cloudflare.
#   Pull requests: check → a Cloudflare preview URL posted on the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its older run; on main, runs
  # queue instead, so a deploy is never cut off half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 22.18+ runs the TypeScript import in app/scripts/prerender.mjs natively.
  NODE_VERSION: 24
  WORKER: benjamin-yankey-portfolio
  # The Cloudflare account's workers.dev subdomain.
  WORKERS_SUBDOMAIN: hueywork

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

  github-pages:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # This copy of the site has no backend of its own; the contact form
          # and assistant call the Cloudflare Worker (it allows this origin).
          VITE_API_BASE: https://${{ env.WORKER }}.${{ env.WORKERS_SUBDOMAIN }}.workers.dev
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v5

  cloudflare:
    name: Deploy to Cloudflare
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: app
    env:
      # "Edit Cloudflare Workers" token template. Without it (or on a pull
      # request from a fork, which gets no secrets) this job says so and passes.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      IS_PR: ${{ github.event_name == 'pull_request' }}
      IS_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN isn't set (or this pull request comes from a fork), so there's nothing to deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: npm run build:cloudflare
        env:
          # Previews get their own host in canonical URLs and link previews.
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}-{1}.{2}.workers.dev', github.event.number, env.WORKER, env.WORKERS_SUBDOMAIN) || '' }}

      - name: Deploy to production
        if: steps.token.outputs.present == 'true' && env.IS_MAIN == 'true'
        run: npx wrangler deploy --message "${{ github.sha }}"

      - name: Upload a preview
        if: steps.token.outputs.present == 'true' && env.IS_PR == 'true'
        run: npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "Pull request ${{ github.event.number }}"

      - name: Comment the preview URL
        if: steps.token.outputs.present == 'true' && env.IS_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://pr-${{ github.event.number }}-${{ env.WORKER }}.${{ env.WORKERS_SUBDOMAIN }}.workers.dev/Portfolio/
        run: |
          body="Preview for this pull request: $URL"
          # Update the bot's earlier comment instead of adding one per push.
          gh pr comment "${{ github.event.number }}" --body "$body" --edit-last 2>/dev/null \
            || gh pr comment "${{ github.event.number }}" --body "$body"
