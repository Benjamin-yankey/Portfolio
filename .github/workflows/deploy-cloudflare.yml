name: Deploy to Cloudflare

# Pushes to main (including CMS edits) deploy the site and its API Worker.
# Pull requests get their own preview URL, posted as a comment. Needs the
# CLOUDFLARE_API_TOKEN secret ("Edit Cloudflare Workers" token template);
# without it the job explains what's missing and passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKER: benjamin-yankey-portfolio
  # The account's workers.dev subdomain: URLs are <worker>.<subdomain>.workers.dev.
  WORKERS_SUBDOMAIN: hueywork

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN isn't set (or this pull request comes from a fork), so there's nothing to deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: npm run build:cloudflare
        env:
          # Previews get their own host in canonical URLs and link previews.
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}-{1}.{2}.workers.dev', github.event.number, env.WORKER, env.WORKERS_SUBDOMAIN) || '' }}

      - name: Deploy to production
        if: steps.token.outputs.present == 'true' && github.event_name != 'pull_request'
        run: npx wrangler deploy --message "${{ github.sha }}"

      - name: Upload a preview
        if: steps.token.outputs.present == 'true' && github.event_name == 'pull_request'
        run: npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "Pull request ${{ github.event.number }}"

      - name: Comment the preview URL
        if: steps.token.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://pr-${{ github.event.number }}-${{ env.WORKER }}.${{ env.WORKERS_SUBDOMAIN }}.workers.dev/Portfolio/
        run: |
          body="Preview for this pull request: $URL"
          # Update the bot's earlier comment instead of adding one per push.
          gh pr comment "${{ github.event.number }}" --body "$body" --edit-last 2>/dev/null \
            || gh pr comment "${{ github.event.number }}" --body "$body"
