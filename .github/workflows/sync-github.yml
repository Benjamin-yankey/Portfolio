name: Sync GitHub data

# Weekly refresh of the repo list and stats shown on the site
# (app/scripts/sync-github.mjs). Commits only when something changed, then
# starts both deploys — a push made with GITHUB_TOKEN doesn't trigger other
# workflows on its own.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh repos and stats
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.mjs | tee "$RUNNER_TEMP/sync-summary.txt"

      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync GitHub repos and stats" -m "$(cat "$RUNNER_TEMP/sync-summary.txt")"
          git push
          gh workflow run deploy.yml --ref main
          gh workflow run deploy-cloudflare.yml --ref main
