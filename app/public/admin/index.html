  <body>
    <!-- Sveltia CMS, a drop-in replacement for Decap CMS that reads the same
         config.yml. Pinned, with an integrity hash so a tampered copy won't
         run on a page that handles GitHub tokens. To upgrade, change the
         version and the hash (`curl -s <url> | openssl dgst -sha384 -binary
         | openssl base64 -A`; releases:
         https://github.com/sveltia/sveltia-cms/releases) and check the
         editor still loads. -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.235.1/dist/sveltia-cms.js"
      integrity="sha384-0buNFRS4cnwrZfClZMgBYxOTaefGGJltRCRnsKTgLl+q0sOGWcd8sgJpgwr1oKUl"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
