<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ece8e1" />
    <script>
      // Set the theme before first paint so dark-mode visitors never see a
      // flash of the light page. src/lib/theme.ts takes over after load.
      (function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161513')
        }
      })()
    </script>
    <title>Benjamin Yankey — Full-Stack &amp; DevOps Engineer</title>
    <meta
      name="description"
      content="Benjamin Yankey — Full-Stack &amp; DevOps Engineer. Web apps in React, Angular and Node.js, shipped on AWS with Terraform, Docker, Kubernetes and CI/CD."
    />
    <link
      rel="preload"
      href="/fonts/Fraunces-variable-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Inter-variable-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replaceAll('~and~', '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
